# Local MySQL 8 for migration development and manual testing.
#
# WHY a container (not the host): production is MySQL 8, while a development machine usually has
# some other engine on 3306 already — often MariaDB. MariaDB and MySQL 8 have diverged enough
# (collations, DDL parsing, reserved words) that migrations MUST be authored and tested against real
# MySQL 8 to be trustworthy. A container gives us that engine, version-pinned and isolated, without
# disturbing whatever the host already runs.
#
# HOST PORT: purely a local-dev artifact — nothing in production depends on it. 3309 by default
# simply to stay clear of a database already on 3306; override with DB_HOST_PORT if it collides.
# Give this service its own container rather than sharing one with another project: different
# schema, different migration chain. Connect with:
#   mysql -h 127.0.0.1 -P ${DB_HOST_PORT:-3309} -uroot -prootpass
# (use 127.0.0.1, not localhost — localhost routes to the MariaDB unix socket.)
#
# BIND ADDRESS: the published port is prefixed `127.0.0.1:`. Docker's default is 0.0.0.0 — every
# interface — and published container ports bypass a host firewall (they are DNAT'd before the
# filter rules UFW manages), so the firewall is not a backstop here.
#
# VERSION: pinned to 8.0.45, matching the zebrafish-facility-manager container and the DO Managed
# MySQL version it was confirmed against. Pinned EXACT, not the floating `mysql:8` tag — that tag
# resolves to the 8.4 LTS line, which DO does not run.
services:
  mysql:
    image: mysql:8.0.45
    container_name: zfin-data-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3309}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: zfin_data
    volumes:
      - zfin_data_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  zfin_data_mysql:
