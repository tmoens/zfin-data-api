# Local MySQL 8 for migration development and manual testing.
#
# WHY a container (not the host): production is DO Managed MySQL 8, but this workstation runs
# MariaDB 10.11 on 3306, and production-until-now (do1) ran MariaDB 10.5. MariaDB and MySQL 8 have
# diverged enough (collations, DDL parsing, reserved words) that migrations MUST be authored and
# tested against real MySQL 8 to be trustworthy at cutover. A container gives us that engine,
# version-pinned and isolated, without disturbing anything on the host.
#
# HOST PORT: purely a local-dev artifact — nothing in production depends on it. 3309 on this machine
# because 3306 is the host MariaDB, 3307 another container, and 3308 the zebrafish-facility-manager
# container (which this deliberately does NOT share: different schema, different migration chain).
# Override with DB_HOST_PORT if 3309 is taken. Connect with:
#   mysql -h 127.0.0.1 -P ${DB_HOST_PORT:-3309} -uroot -prootpass
# (use 127.0.0.1, not localhost — localhost routes to the MariaDB unix socket.)
#
# BIND ADDRESS: the published port is prefixed `127.0.0.1:`. Docker's default is 0.0.0.0 — every
# interface — and published container ports bypass a host firewall (they are DNAT'd before the
# filter rules UFW manages), so the firewall is not a backstop here.
#
# VERSION: pinned to 8.0.45, matching the zebrafish-facility-manager container and the DO Managed
# MySQL version it was confirmed against. Pinned EXACT, not the floating `mysql:8` tag — that tag
# resolves to the 8.4 LTS line, which DO does not run.
services:
  mysql:
    image: mysql:8.0.45
    container_name: zfin-data-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3309}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: zfin_data
    volumes:
      - zfin_data_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  zfin_data_mysql:
